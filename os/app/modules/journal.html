<h1 class="app-title">DAILY JOURNAL</h1>
<p class="app-description">A private daily notebook for the founders.</p>
<div class="app-content">
  <div class="journal-page">
    <div class="journal-date" data-journal-date></div>
    <textarea
      class="journal-input"
      data-journal-input
      rows="6"
      placeholder="Write today's entry…"
    ></textarea>
    <button type="button" class="journal-save" data-journal-save>SAVE ENTRY</button>
  </div>
  <div class="journal-list" data-journal-list>
    <p class="app-message">Loading…</p>
  </div>
</div>
